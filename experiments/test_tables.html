    <!-- Override loadTables to use demo data after tables.js loads -->
    <script>
        // Wait for tablesController to be initialized, then override its methods
        (function waitForController() {
            if (window.tablesController) {
                // Override loadTables
                const originalLoadTables = window.tablesController.loadTables.bind(window.tablesController);
                window.tablesController.loadTables = async function() {
                    const loadingEl = document.getElementById('tables-loading');

                    // Demo data based on the terms.json from the issue
                    this.tables = [
                        { id: 2974, type: 4, name: "Action Payment" },
                        { id: 137, type: 3, name: "Form" },
                        { id: 29, type: 3, name: "Format" },
                        { id: 63, type: 8, name: "Function" },
                        { id: 47, type: 3, name: "Grant" },
                        { id: 1141, type: 3, name: "Plan" },
                        { id: 22, type: 3, name: "Query" },
                        { id: 17599, type: 3, name: "Recruit" },
                        { id: 42, type: 3, name: "Role" },
                        { id: 65, type: 3, name: "Total" },
                        { id: 18, type: 3, name: "User" },
                        { id: 269, type: 3, name: "Settings" },
                        { id: 100, type: 5, name: "Calendar" },
                        { id: 101, type: 6, name: "Events" },
                        { id: 102, type: 7, name: "Flags" },
                        { id: 103, type: 9, name: "Notes" }
                    ];

                    console.log('[demo] Loaded demo tables:', this.tables);

                    if (loadingEl) {
                        loadingEl.style.display = 'none';
                    }
                };

                // Override saveConfig
                window.tablesController.saveConfig = async function() {
                    console.log('[demo] Would save config:', JSON.stringify(this.config, null, 2));
                };

                // Override createNewTable
                window.tablesController.createNewTable = async function() {
                    const nameInput = document.getElementById('new-table-name');
                    const typeSelect = document.getElementById('new-table-type');

                    if (!nameInput || !typeSelect) return;

                    const name = nameInput.value.trim();
                    const type = parseInt(typeSelect.value);

                    if (!name) {
                        alert('Введите название таблицы');
                        return;
                    }

                    const newId = Math.floor(Math.random() * 10000) + 20000;
                    this.tables.push({ id: newId, type: type, name: name });

                    const firstFolder = Object.keys(this.config)[0];
                    if (firstFolder) {
                        if (!this.config[firstFolder].tabs) {
                            this.config[firstFolder].tabs = [];
                        }
                        this.config[firstFolder].tabs.unshift(String(newId));
                    }

                    console.log('[demo] Created new table:', { id: newId, type: type, name: name });
                    this.render();
                    this.hideNewTableModal();
                };

                // Re-initialize with overridden methods
                window.tablesController.init();
            } else {
                setTimeout(waitForController, 50);
            }
        })();
    </script>
