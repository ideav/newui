<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Web приложение</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-left">
            <img src="images/logo.png" alt="Логотип" class="logo">
        </div>
        <div class="navbar-right">
            <button id="theme-toggle" class="theme-toggle">🌙 Темная</button>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="auth-container">
        <div class="auth-card">
            <h1>Вход</h1>
            <p>Войдите в свой аккаунт</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email адрес</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Введите пароль">
                </div>

                <button type="submit" class="btn-primary">Войти</button>
            </form>

            <div class="auth-divider" id="login-divider" style="display: none;">или</div>

            <div class="oauth-buttons-container">
                <button type="button" id="yandex-login-btn" class="btn-yandex btn-oauth-compact" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.002 0C5.375 0 0 5.375 0 12s5.375 12 12.002 12C18.626 24 24 18.625 24 12S18.626 0 12.002 0zM15.24 16.2h-1.68V8.04h-1.2c-1.637 0-2.52.818-2.52 2.045 0 1.39.597 2.047 1.843 2.87l1.017.676-2.903 4.57H7.92l2.676-3.913C9.08 13.18 8.16 12.11 8.16 10.016c0-2.24 1.554-3.696 4.306-3.696h2.774v9.88z"/>
                    </svg>
                    <span class="btn-text">Яндекс</span>
                </button>
                <button type="button" id="google-login-btn" class="btn-google btn-oauth-compact" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="btn-text">Google</span>
                </button>

            </div>

            <div class="auth-links">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                <br>
                <a href="config.html">Настройки API</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
