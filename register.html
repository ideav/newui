<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Web приложение</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-left">
            <img src="images/logo.png" alt="Логотип" class="logo">
        </div>
        <div class="navbar-right">
            <button id="theme-toggle" class="theme-toggle">🌙 Темная</button>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="auth-container">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <p>Создайте новый аккаунт</p>

            <button type="button" id="yandex-register-btn" class="btn-yandex" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm3.9 16.2h-2.6l-2.5-7.1h-.1c.1.8.1 1.5.1 2.2v4.9H8.1V7.8h2.6l2.5 7h.1c0-.7-.1-1.4-.1-2.1V7.8h2.7v8.4z"/>
                </svg>
                Зарегистрироваться через Яндекс ID
            </button>

            <div class="auth-divider" id="register-divider" style="display: none;">или</div>

            <form id="register-form">
                <div class="form-group">
                    <label for="email">Email адрес</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Минимум 6 символов" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Повторите пароль">
                </div>

                <button type="submit" class="btn-primary">Зарегистрироваться</button>

                <div class="auth-links">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                    <br>
                    <a href="config.html">Настройки API</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
